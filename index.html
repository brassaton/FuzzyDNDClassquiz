<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What D&D Class Should You Play?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="start-screen" class="screen active">
      <div class="card hero">
        <div class="eyebrow">D&D CHARACTER QUIZ</div>
        <h1>What D&D Class Should You Play?</h1>
        <p class="subtitle">Answer a few questions and discover the class and subclass that best match the way you want to play.</p>
        <button id="start-btn" class="primary-btn">Start Quiz</button>
      </div>
    </section>

    <section id="quiz-screen" class="screen">
      <div class="quiz-header">
        <div>
          <div id="question-counter" class="eyebrow"></div>
          <h2 id="question-title"></h2>
        </div>
        <div id="progress-text" class="progress-text"></div>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>

      <div id="answers" class="answers"></div>

      <div class="quiz-controls">
        <button id="back-btn" class="secondary-btn">Back</button>
        <button id="next-btn" class="primary-btn" disabled>Next</button>
      </div>
    </section>

    <section id="results-screen" class="screen">
      <div class="card results">
        <div class="eyebrow">YOUR RESULT</div>
        <h1 id="result-class"></h1>
        <div id="result-subclass" class="result-subclass"></div>
        <p id="result-description" class="result-description"></p>

        <div class="result-section">
          <h3>Why it fits you</h3>
          <ul id="reasons"></ul>
        </div>

        <div class="result-section">
          <h3>Your other strong matches</h3>
          <div id="others" class="matches"></div>
        </div>

        <button id="restart-btn" class="primary-btn">Take Quiz Again</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
